<style>
  :root{
    --deep:#08332B; --deep2:#0E4A3C; --gold:#C9A15A; --gold-bright:#E6C87A;
    --cream:#F6F1E4; --cream-dim:#D9D0B8; --line:rgba(230,200,122,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 10% -10%, #0E5443 0%, transparent 60%),
      radial-gradient(1200px 700px at 100% 0%, #0A3E32 0%, transparent 55%), var(--deep);
    color:var(--cream); font-family:'Jost','Noto Nastaliq Urdu',sans-serif; min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px;}
  a.backlink{display:inline-block;color:var(--gold-bright);text-decoration:none;font-family:'Jost',sans-serif;font-size:12px;margin-bottom:10px;}
  header.top{text-align:center;padding:14px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  header.top h1{font-family:'Noto Nastaliq Urdu',serif;font-weight:700;font-size:24px;margin:0 0 4px;}
  header.top p{font-family:'Noto Nastaliq Urdu',serif;font-size:13px;color:var(--cream-dim);margin:0;}

  .tabbar{display:flex;overflow-x:auto;gap:6px;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--line);
    direction:rtl;-webkit-overflow-scrolling:touch;}
  .tabbar::-webkit-scrollbar{height:4px;}
  .tabbtn{flex-shrink:0;background:var(--deep2);border:1px solid var(--line);color:var(--cream);border-radius:20px;
    padding:8px 14px;font-family:'Noto Nastaliq Urdu',serif;font-size:14px;cursor:pointer;white-space:nowrap;}
  .tabbtn.active{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:600;}

  .topic{display:none;direction:rtl;}
  .topic.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}

  .topic h2{font-family:'Noto Nastaliq Urdu',serif;color:var(--gold-bright);font-size:22px;margin:0 0 6px;}
  .topic .note{font-family:'Noto Nastaliq Urdu',serif;font-size:13px;color:var(--cream-dim);background:rgba(230,200,122,0.07);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px;line-height:1.9;}
  .topic p{font-family:'Noto Nastaliq Urdu',serif;font-size:16px;line-height:2.1;color:var(--cream);}

  .steps{counter-reset:step;list-style:none;padding:0;margin:0;}
  .steps li{counter-increment:step;position:relative;padding:12px 50px 12px 12px;margin-bottom:10px;
    background:rgba(230,200,122,0.05);border:1px solid var(--line);border-radius:10px;
    font-family:'Noto Nastaliq Urdu',serif;font-size:15px;line-height:2;}
  .steps li::before{content:counter(step);position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;
    background:var(--gold);color:var(--deep);display:flex;align-items:center;justify-content:center;
    font-family:'Jost',sans-serif;font-weight:700;font-size:13px;}
  .steps li{padding-right:48px;}
  .steps .step-title{color:var(--gold-bright);font-weight:700;display:block;margin-bottom:4px;}

  .arabic{font-family:'Scheherazade New',serif;font-size:26px;color:var(--gold-bright);direction:rtl;line-height:1.8;display:block;margin:6px 0;}
  .translit{font-family:'Jost',sans-serif;font-size:12px;color:var(--cream-dim);direction:ltr;display:block;}
  .meaning{font-family:'Noto Nastaliq Urdu',serif;font-size:14px;color:var(--cream);display:block;margin-top:2px;}

  .card{background:rgba(230,200,122,0.05);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .card .occasion{font-family:'Jost',sans-serif;font-size:11px;color:var(--gold);letter-spacing:.04em;margin-bottom:6px;direction:ltr;}

  .hadith-card{border-right:3px solid var(--gold);padding-right:12px;margin-bottom:16px;}
  .hadith-card .src{font-family:'Jost',sans-serif;font-size:11px;color:var(--gold-bright);margin-top:6px;direction:ltr;}

  h3.sub{font-family:'Noto Nastaliq Urdu',serif;color:var(--gold);font-size:17px;margin:20px 0 8px;}

  .calc-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .calc-row label{flex:1;font-family:'Noto Nastaliq Urdu',serif;font-size:14px;}
  .calc-row input{width:130px;background:var(--deep2);border:1px solid var(--line);border-radius:8px;color:var(--cream);
    padding:8px;font-family:'Jost',sans-serif;font-size:14px;direction:ltr;text-align:left;}
  .calc-btn{background:var(--gold);color:var(--deep);border:none;border-radius:8px;padding:10px 18px;font-weight:700;
    font-family:'Noto Nastaliq Urdu',serif;font-size:15px;cursor:pointer;margin-top:8px;}
  .calc-result{margin-top:14px;padding:14px;background:rgba(230,200,122,0.1);border:1px solid var(--gold);border-radius:10px;
    font-family:'Noto Nastaliq Urdu',serif;font-size:15px;display:none;}
  .calc-result.show{display:block;}
  .calc-result b{color:var(--gold-bright);font-size:20px;}

  .cal-panel{background:rgba(230,200,122,0.07);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center;margin-bottom:16px;}
  .cal-panel .hijri-big{font-family:'Scheherazade New',serif;font-size:30px;color:var(--gold-bright);}
  .cal-panel .greg-small{font-family:'Jost',sans-serif;font-size:12px;color:var(--cream-dim);direction:ltr;margin-top:4px;}

  .months-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
  .months-grid div{background:var(--deep2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
    font-family:'Noto Nastaliq Urdu',serif;}
  .months-grid .num{color:var(--gold);font-family:'Jost',sans-serif;margin-left:6px;}

  .timings-table{width:100%;border-collapse:collapse;margin-top:10px;}
  .timings-table td{padding:8px 4px;border-bottom:1px solid var(--line);font-family:'Jost',sans-serif;}
  .timings-table td:first-child{font-family:'Noto Nastaliq Urdu',serif;color:var(--gold-bright);}
  .timings-table td:last-child{text-align:left;direction:ltr;font-weight:600;}
  .locbtn{background:var(--gold);color:var(--deep);border:none;border-radius:8px;padding:10px 16px;font-weight:700;
    font-family:'Noto Nastaliq Urdu',serif;font-size:14px;cursor:pointer;}
</style>

<div class="wrap">
  <a class="backlink" href="index.html">◀ قرآن پاک ایپ پر واپس</a>

    <h1>تعلیمِ اسلام</h1>
    <p>نماز، وضو، غسل، حج، عمرہ، زکوٰۃ، دعائیں، احادیث اور اسلامی کیلنڈر</p>
  </header>

  <div class="tabbar" id="tabbar"></div>
  <div id="topics"></div>
</div>

<script>
(function(){

// ---------- Islamic (tabular) calendar conversion — works offline, no API needed ----------
function gregorianToHijri(date){
  let y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  let jd = Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)
    + Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)
    - Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)
    + d - 32075;
  const epoch = 1948440;
  let l = jd - epoch + 10632;
  let n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  let j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  let hMonth = Math.floor((24*l)/709);
  let hDay = l - Math.floor((709*hMonth)/24);
  let hYear = 30*n + j - 30;
  return {year:hYear, month:hMonth, day:hDay};
}
function hijriToGregorian(hYear,hMonth,hDay){
  const epoch = 1948440;
  let jd = hDay + Math.ceil(29.5*(hMonth-1)) + (hYear-1)*354 + Math.floor((3+11*hYear)/30) + epoch - 1;
  let l = jd + 68569;
  let n = Math.floor((4*l)/146097);
  l = l - Math.floor((146097*n+3)/4);
  let i = Math.floor((4000*(l+1))/1461001);
  l = l - Math.floor((1461*i)/4) + 31;
  let j = Math.floor((80*l)/2447);
  let day = l - Math.floor((2447*j)/80);
  l = Math.floor(j/11);
  let month = j + 2 - 12*l;
  let year = 100*(n-49) + i + l;
  return new Date(year, month-1, day);
}
const HIJRI_MONTHS = ['محرم','صفر','ربیع الاول','ربیع الثانی','جمادی الاولیٰ','جمادی الثانیہ','رجب','شعبان','رمضان','شوال','ذوالقعدہ','ذوالحجہ'];

// ---------- Topics ----------
const TOPICS = [
{id:'namaz', icon:'🕌', title:'نماز کا طریقہ', render: renderNamaz},
{id:'wudu', icon:'💧', title:'وضو کا طریقہ', render: renderWudu},
{id:'ghusl', icon:'🚿', title:'غسل کا طریقہ', render: renderGhusl},
{id:'janazah', icon:'🤲', title:'نماز جنازہ', render: renderJanazah},
{id:'dua', icon:'📿', title:'دعائیں', render: renderDuas},
{id:'hadith', icon:'📖', title:'احادیث', render: renderHadith},
{id:'itikaf', icon:'🕋', title:'اعتکاف', render: renderItikaf},
{id:'umrah', icon:'🕋', title:'عمرہ', render: renderUmrah},
{id:'hajj', icon:'🕋', title:'حج', render: renderHajj},
{id:'zakat', icon:'💰', title:'زکوٰۃ + کیلکولیٹر', render: renderZakat},
{id:'ramadan-timings', icon:'🌙', title:'سحر و افطار اوقات', render: renderRamadanTimings},
{id:'ramadan-calendar', icon:'📅', title:'رمضان کب آئے گا', render: renderRamadanCalendar},
{id:'islamic-calendar', icon:'🗓️', title:'اسلامی کیلنڈر سمجھیں', render: renderIslamicCalendar},
];

const tabbar = document.getElementById('tabbar');
const topicsEl = document.getElementById('topics');

TOPICS.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tabbtn' + (i===0?' active':'');
  btn.textContent = `${t.icon} ${t.title}`;
  btn.addEventListener('click', ()=> selectTab(t.id));
  btn.dataset.id = t.id;
  tabbar.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'topic' + (i===0?' active':'');
  sec.id = 'topic-'+t.id;
  sec.innerHTML = t.render();
  topicsEl.appendChild(sec);
});

function selectTab(id){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.querySelectorAll('.topic').forEach(s=>s.classList.toggle('active', s.id==='topic-'+id));
  window.scrollTo({top:0,behavior:'smooth'});
}

// ---------- Zakat calculator (wired here, not via inline <script> in innerHTML — scripts inserted via innerHTML never run) ----------
const zakatBtn = document.getElementById('zakatCalcBtn');
if(zakatBtn){
  zakatBtn.addEventListener('click', function(){
    function num(id){ const v = parseFloat(document.getElementById(id).value); return isNaN(v)?0:v; }
    const total = num('zCash')+num('zGold')+num('zSilver')+num('zStock')+num('zInvest')-num('zDebt');
    const silverPrice = num('zSilverPrice');
    const nisab = silverPrice > 0 ? silverPrice*612.36 : null;
    const resultEl = document.getElementById('zakatResult');
    if(total <= 0){
      resultEl.innerHTML = '<div>آپ کا خالص مال صفر یا منفی ہے — فی الحال زکوٰۃ فرض نہیں۔</div>';
      resultEl.classList.add('show');
      return;
    }
    let html = '';
    if(nisab !== null){
      if(total >= nisab){
        const zakat = total * 0.025;
        html = `آپ کا مال نصاب (روپے ${Math.round(nisab).toLocaleString()}) سے زیادہ ہے۔<br>واجب الادا زکوٰۃ: <b>روپے ${Math.round(zakat).toLocaleString()}</b> (2.5%)`;
      } else {
        html = `آپ کا مال (روپے ${Math.round(total).toLocaleString()}) نصاب (روپے ${Math.round(nisab).toLocaleString()}) سے کم ہے — فی الحال زکوٰۃ فرض نہیں، لیکن نفلی صدقہ بہترین عمل ہے۔`;
      }
    } else {
      const zakat = total * 0.025;
      html = `چاندی کی قیمت درج نہیں کی — نصاب چیک نہیں ہو سکا۔ اگر آپ کا مال نصاب کے برابر ہے تو زکوٰۃ ہو گی: <b>روپے ${Math.round(zakat).toLocaleString()}</b> (2.5%)`;
    }
    resultEl.innerHTML = html;
    resultEl.classList.add('show');
  });
}

// ---------- Ramadan Sehri/Iftar timings (wired here for the same reason) ----------
const ramBtn = document.getElementById('ramTimingsBtn');
if(ramBtn){
  ramBtn.addEventListener('click', function(){
    const el = document.getElementById('ramTimingsResult');
    el.innerHTML = '<p>مقام معلوم کیا جا رہا ہے…</p>';
    if(!navigator.geolocation){ el.innerHTML = '<p>یہ براؤزر لوکیشن سپورٹ نہیں کرتا۔</p>'; return; }
    navigator.geolocation.getCurrentPosition(async function(pos){
      try{
        const {latitude, longitude} = pos.coords;
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
        const params = new URLSearchParams({latitude, longitude, timezone:tz, method:1, school:1});
        const res = await fetch('https://api.islamic.app/v1/timings/today?'+params);
        const json = await res.json();
        const t = json.data.timings;
        el.innerHTML = `<table class="timings-table">
          <tr><td>سحری ختم (فجر)</td><td>${t.Fajr}</td></tr>
          <tr><td>افطار (مغرب)</td><td>${t.Maghrib}</td></tr>
        </table><p style="font-family:Jost,sans-serif;font-size:11px;color:var(--cream-dim);">${json.data.date.readable}</p>`;
      }catch(e){ el.innerHTML = '<p>اوقات معلوم نہیں ہو سکے، دوبارہ کوشش کریں۔</p>'; }
    }, function(){ el.innerHTML = '<p>لوکیشن کی اجازت نہیں دی گئی۔</p>'; });
  });
}

// ---------- Content renderers ----------

function renderNamaz(){
  return `
  <h2>🕌 نماز کا طریقہ</h2>
  <div class="note">یہ عام (حنفی) طریقہ ہے جو پاکستان میں رائج ہے۔ ہر رکعت میں ترتیب یہی رہتی ہے، صرف رکعتوں کی تعداد فرض/سنت کے مطابق بدلتی ہے۔</div>
  <ol class="steps">
    <li><span class="step-title">نیت</span>دل میں نیت کریں کہ کون سی نماز، کتنی رکعتیں پڑھ رہے ہیں، قبلہ رخ کھڑے ہو جائیں۔</li>
    <li><span class="step-title">تکبیرِ تحریمہ</span>
      <span class="arabic">اللهُ أَكْبَرُ</span><span class="translit">Allahu Akbar</span><span class="meaning">اللہ سب سے بڑا ہے — دونوں ہاتھ کانوں تک اٹھا کر باندھ لیں۔</span>
    </li>
    <li><span class="step-title">ثناء (قیام میں)</span>
      <span class="arabic">سُبْحَانَكَ اللّٰهُمَّ وَبِحَمْدِكَ وَتَبَارَكَ اسْمُكَ وَتَعَالٰى جَدُّكَ وَلَا إِلٰهَ غَيْرُكَ</span>
      <span class="meaning">اے اللہ تو پاک ہے، تیری تعریف کے ساتھ، تیرا نام بابرکت ہے، تیری شان بلند ہے، تیرے سوا کوئی معبود نہیں۔</span>
    </li>
    <li><span class="step-title">تعوذ و تسمیہ + سورۃ الفاتحہ</span>اعوذ باللہ اور بسم اللہ پڑھ کر سورۃ الفاتحہ مکمل پڑھیں، پھر کوئی چھوٹی سورت ملائیں۔</li>
    <li><span class="step-title">رکوع</span>
      <span class="arabic">سُبْحَانَ رَبِّيَ الْعَظِيمِ</span><span class="translit">Subhana Rabbiyal Azeem</span>
      <span class="meaning">پاک ہے میرا رب جو عظمت والا ہے — تین بار، کمر جھکا کر ہاتھ گھٹنوں پر۔</span>
    </li>
    <li><span class="step-title">قومہ (رکوع سے اٹھنا)</span>
      <span class="arabic">سَمِعَ اللّٰهُ لِمَنْ حَمِدَهُ، رَبَّنَا لَكَ الْحَمْدُ</span>
      <span class="meaning">اللہ نے سن لی اس کی جس نے اس کی حمد کی، اے ہمارے رب تیرے ہی لیے تمام تعریفیں۔</span>
    </li>
    <li><span class="step-title">سجدہ (پہلا)</span>
      <span class="arabic">سُبْحَانَ رَبِّيَ الْأَعْلَىٰ</span><span class="translit">Subhana Rabbiyal A'la</span>
      <span class="meaning">پاک ہے میرا رب جو سب سے بلند ہے — تین بار، پیشانی، ناک، دونوں ہاتھ، گھٹنے اور پاؤں زمین پر۔</span>
    </li>
    <li><span class="step-title">جلسہ (دو سجدوں کے درمیان بیٹھنا)</span>مختصر سیدھے بیٹھ کر دوسرے سجدے کی طرف جائیں۔</li>
    <li><span class="step-title">سجدہ (دوسرا)</span>وہی تسبیح دہرائیں جو پہلے سجدے میں پڑھی تھی۔ اس سے ایک رکعت مکمل ہوئی۔</li>
    <li><span class="step-title">دوسری رکعت</span>کھڑے ہو کر دوبارہ سورۃ الفاتحہ اور سورت سے شروع کریں، رکوع و سجدے دہرائیں۔</li>
    <li><span class="step-title">تشہد (قعدہ)</span>
      <span class="arabic">التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ...</span>
      <span class="meaning">دو یا آخری رکعت کے بعد بیٹھ کر پڑھیں، شہادت کی انگلی سے اشارہ کریں۔</span>
    </li>
    <li><span class="step-title">درود شریف (آخری قعدہ میں)</span>
      <span class="arabic">اللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ...</span>
      <span class="meaning">آخری رکعت کے تشہد کے بعد پڑھا جاتا ہے۔</span>
    </li>
    <li><span class="step-title">دعا</span>کوئی مسنون دعا پڑھیں، مثلاً "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً..."۔</li>

    <li><span class="step-title">9 ذوالحجہ — میدانِ عرفات (وقوفِ عرفہ)</span>سورج ڈھلنے کے بعد عرفات پہنچیں، ظہر اور عصر ملا کر پڑھیں، غروبِ آفتاب تک دعا، ذکر اور استغفار میں مصروف رہیں — یہ حج کا سب سے اہم رکن ہے۔</li>

    <li><span class="step-title">10 ذوالحجہ — یومِ عید (رمی، قربانی، حلق)</span>
      1) جمرہ عقبہ کو 7 کنکریاں ماریں،
      2) قربانی کریں،
      3) مرد سر منڈوائیں/بال چھوٹے کروائیں — اس سے بیشتر پابندیاں ختم ہو جاتی ہیں۔
    </li>
    <li><span class="step-title">طوافِ زیارت (طوافِ افاضہ)</span>10، 11 یا 12 ذوالحجہ کو مکہ جا کر کعبہ کا طواف کریں (سعی بھی، اگر پہلے نہ کی ہو) — یہ حج کا لازمی رکن ہے۔</li>
    <li><span class="step-title">11 و 12 ذوالحجہ — تینوں جمرات کی رمی</span>ہر دن، سورج ڈھلنے کے بعد، تینوں جمرات (صغریٰ، وسطیٰ، عقبہ) کو 7-7 کنکریاں ماریں، منیٰ میں قیام جاری رکھیں۔</li>
    <li><span class="step-title">طوافِ وداع</span>مکہ سے واپسی سے پہلے، سب سے آخر میں، الوداعی طواف کریں — حج مکمل ہوا۔</li>
  </ol>
  <div class="note">حج کے مسائل میں بہت سی تفصیلات اور استثناء ہوتے ہیں (بیمار، خواتین، معذور افراد کے لیے آسانیاں) — روانگی سے پہلے کسی مستند حج گائیڈ/عالم سے تربیت ضرور لیں۔</div>`;
}

function renderRamadanCalendar(){
  const today = new Date();
  const h = gregorianToHijri(today);
  let targetYear = h.year;
  if(h.month > 9 || (h.month === 9 && h.day > 0 && h.month===9 && false)) {}
  if(h.month >= 9) targetYear = h.year + 1; // if we're already at/past Ramadan this year, estimate next year's
  const estStart = hijriToGregorian(targetYear, 9, 1);
  const estEnd = hijriToGregorian(targetYear, 9, 29);
  const fmt = d => d.toLocaleDateString('ur-PK-u-ca-gregory', {day:'numeric',month:'long',year:'numeric'});
  return `
  <h2>📅 رمضان کب آئے گا (اندازہ)</h2>
  <div class="note">⚠️ یہ اندازہ ریاضی کے حساب کتاب (tabular calendar) پر مبنی ہے۔ رمضان کی اصل تاریخ کا تعین چاند دیکھ کر ہوتا ہے، اور اس میں ایک دن آگے پیچھے ہو سکتا ہے۔ حتمی تاریخ کے لیے اپنے ملک کی رویتِ ہلال کمیٹی کے اعلان کا انتظار کریں۔</div>
  <div class="cal-panel">
    <div style="font-family:Jost,sans-serif;font-size:13px;color:var(--cream-dim);">اندازاً رمضان ${targetYear} ہجری شروع ہو گا</div>
    <div class="hijri-big">${fmt(estStart)}</div>
    <div class="greg-small">سے تقریباً ${fmt(estEnd)} تک (29 یا 30 دن)</div>
  </div>`;
}

function renderIslamicCalendar(){
  const today = new Date();
  const h = gregorianToHijri(today);
  const monthsHtml = HIJRI_MONTHS.map((m,i)=>`<div><span class="num">${i+1}.</span>${m}</div>`).join('');
  return `
  <h2>🗓️ اسلامی (ہجری) کیلنڈر کیسے سمجھیں</h2>
  <div class="cal-panel">
    <div style="font-family:Jost,sans-serif;font-size:12px;color:var(--cream-dim);">آج کی تاریخ</div>
    <div class="hijri-big">${h.day} ${HIJRI_MONTHS[h.month-1]} ${h.year}ھ</div>
    <div class="greg-small">${today.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} کے مطابق</div>
  </div>
  <p>اسلامی کیلنڈر <b>چاند</b> کی گردش پر مبنی ہے (قمری سال)، جبکہ انگریزی کیلنڈر <b>سورج</b> پر مبنی ہے (شمسی سال)۔ اسی وجہ سے ہر سال اسلامی مہینے انگریزی کیلنڈر میں تقریباً 10-11 دن پیچھے آتے ہیں۔</p>
  <p>قمری سال کل <b>12 مہینوں</b> پر مشتمل ہے، ہر مہینہ نئے چاند کے دکھائی دینے سے شروع ہوتا ہے اور 29 یا 30 دن کا ہوتا ہے۔ اسلامی تاریخ کا آغاز حضرت محمد ﷺ کی مکہ سے مدینہ ہجرت سے ہوتا ہے، اسی لیے اسے "ہجری" کہتے ہیں۔</p>
  <h3 class="sub">اسلامی سال کے 12 مہینے</h3>
  <div class="months-grid">${monthsHtml}</div>
  <p style="margin-top:14px;">اہم مہینے: <b>رمضان</b> (9واں، روزوں کا مہینہ)، <b>ذوالحجہ</b> (12واں، حج کا مہینہ)، <b>محرم</b> (پہلا، نیا اسلامی سال شروع ہوتا ہے)۔</p>
  <div class="note">اوپر دکھائی گئی تاریخ ریاضی کے حساب سے ہے — مقامی مسجد یا رویتِ ہلال کمیٹی کا اعلان حتمی تاریخ کے لیے ہمیشہ زیادہ معتبر ہوتا ہے۔</div>`;
}
